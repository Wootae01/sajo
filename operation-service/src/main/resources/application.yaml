server:
  port: 8084

spring:
  application:
    name: operation-service

  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      retry:
        max-attempts: 10
        initial-interval: 2000

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

  # 알람 이력 저장용. operation-service에게 Mongo는 부가 의존성이라 장애 시 빨리 포기해야 한다 -
  # 저장은 알람 처리 스레드(resolved는 원본 발송 전용 alertNotifyExecutor)에서 하므로, 기본값(서버 선택 30s, 소켓 무제한)이면
  # Mongo 장애 동안 그 스레드가 붙잡혀 다음 알람 원본 발송까지 밀린다. URI 공통 옵션은 아래 프로필별 uri에 붙인다.
  data:
    mongodb:
      # 인덱스는 MongoIndexInitializer가 기동 후 만든다(자동 생성은 Mongo 장애 시 기동 실패 위험)
      auto-index-creation: false

sajo:
  prometheus:
    rest-client:
      connect-timeout-ms: ${PROMETHEUS_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${PROMETHEUS_READ_TIMEOUT_MS:5000}
  openai:
    rest-client:
      # LLM 응답 생성은 Prometheus 조회보다 오래 걸릴 수 있어 read timeout을 넉넉히 둠
      connect-timeout-ms: ${OPENAI_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${OPENAI_READ_TIMEOUT_MS:90000}
  webhook:
    # Alertmanager와 operation-service 컨테이너에 같은 파일을 마운트해서 공유 시크릿으로 씀
    # (alertmanager.yml의 webhook_configs.http_config.authorization.credentials_file과 짝)
    secret-file-path: /etc/operation-service/secrets/webhook_secret
  slack:
    # chat.postMessage 응답의 ts로 분석 결과를 스레드 답글로 붙이기 위해 Incoming Webhook 대신 Bot 토큰을 씀
    bot-token: ${SLACK_BOT_TOKEN}
    channel-id: ${SLACK_CHANNEL_ID}
    api-base-url: ${SLACK_API_BASE_URL:https://slack.com/api}
    rest-client:
      connect-timeout-ms: ${SLACK_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${SLACK_READ_TIMEOUT_MS:5000}

management:
  health:
    mongodb:
      # Mongo는 부가 의존성 - 배포 헬스체크(/actuator/health UP)가 Mongo 장애로 실패하지 않게 제외
      enabled: false
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,prometheus}
  metrics:
    distribution:
      slo:
        "[http.server.requests]": 1s
      percentiles-histogram:
        "[http.server.requests]": true

---
spring:
  config:
    activate:
      on-profile: local
  mongodb:
    uri: mongodb://root:${MONGO_PASSWORD}@localhost:27017/operation_db?authSource=admin&serverSelectionTimeoutMS=2000&connectTimeoutMS=2000&socketTimeoutMS=3000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

sajo:
  prometheus:
    base-url: http://localhost:9090

---
spring:
  config:
    activate:
      on-profile: prod
  # database는 operation_db로 분리 (같은 mongo-ai-risk 인스턴스의 ai_risk_db와 섞이지 않게)
  # MONGO_PASSWORD가 URI에 그대로 삽입됨 - URI 예약문자(@ : / ? # %) 포함 시 파싱이 깨질 수 있음(trading-service와 동일 제약)
  mongodb:
    uri: mongodb://root:${MONGO_PASSWORD}@mongo-ai-risk:27017/operation_db?authSource=admin&serverSelectionTimeoutMS=2000&connectTimeoutMS=2000&socketTimeoutMS=3000

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/

sajo:
  prometheus:
    base-url: http://prometheus:9090
