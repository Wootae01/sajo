# Alertmanager가 수신한 알람을 어떤 Receiver로 전달할지 정의하는 최상위 Route
route:
  receiver: default

  # alertname과 application 라벨이 같은 알람을 하나의 그룹으로 묶음
  group_by: [alertname, application]

  # 새로운 알람 그룹이 처음 발생했을 때 10초간 대기 후 전송
  # (같은 시간대에 발생한 관련 알람을 하나로 묶기 위함)
  group_wait: 10s

  # 그룹에 새 알람이 추가됐을 때 갱신 알림을 보내는 최소 간격
  group_interval: 30s

  # firing 상태가 계속 유지될 때 같은 알림을 재전송하는 주기
  repeat_interval: 1h

  # 모든 알람은 operation-service 웹훅을 거쳐 Slack으로 가므로, operation-service 자신이 죽으면
  # 자기 ServiceDown을 포함해 어떤 알람도 Slack에 도달하지 못한다(알림 경로 단일 장애점).
  # operation-service 자신의 장애 알람만 웹훅을 건너뛰고 Slack Incoming Webhook으로 직접 보낸다.
  #  - ServiceDown: operation-service 프로세스가 죽음
  #  - SlackSendFailing: 프로세스는 살아 있지만 Slack 발송이 실패함(토큰/채널 문제 등)
  routes:
    - matchers:
        - alertname=~"ServiceDown|SlackSendFailing"
        - application="operation-service"
      receiver: slack-direct

# 같은 대상에서 critical이 firing 중이면 같은 alertname의 warning은 억제 (중복 알림 방지)
# rules.yml에서 severity만 다르고 alertname은 같게 만든 쌍
inhibit_rules:
  - source_matchers:
      - alertname="HighCpuUsage"
      - severity="critical"
    target_matchers:
      - alertname="HighCpuUsage"
      - severity="warning"
    equal: [application, instance]

  - source_matchers:
      - alertname="RedisMemoryHigh"
      - severity="critical"
    target_matchers:
      - alertname="RedisMemoryHigh"
      - severity="warning"
    equal: [instance]

  - source_matchers:
      - alertname="HighNodeCpuUsage"
      - severity="critical"
    target_matchers:
      - alertname="HighNodeCpuUsage"
      - severity="warning"
    equal: [application, instance]

  - source_matchers:
      - alertname="NodeDiskLow"
      - severity="critical"
    target_matchers:
      - alertname="NodeDiskLow"
      - severity="warning"
    equal: [instance, mountpoint]

receivers:
  - name: default
    webhook_configs:
      - url: http://operation-service:8084/api/v1/operations/webhook
        send_resolved: true
        # operation-service의 AlertWebhookAuthenticationFilter가 이 값을 검증함 - 같은 파일을
        # operation-service 컨테이너에도 마운트해서 공유 시크릿으로 씀 (docker-compose 참고)
        http_config:
          authorization:
            credentials_file: /etc/alertmanager/secrets/operation_webhook_secret

  # operation-service를 거치지 않는 Slack 직송 경로 - LLM 분석 없이 원본만 보낸다.
  # Alertmanager 설정은 환경변수를 읽지 못해서 Incoming Webhook URL(SLACK_WEBHOOK_URL)을 파일로 마운트한다
  # (배포 workflow가 GitHub Secret으로 monitoring/secrets/slack_webhook_url을 생성).
  - name: slack-direct
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:red_circle:{{ else }}:white_check_mark:{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.application }})'
        text: |-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}_operation-service 장애로 LLM 분석 없이 Alertmanager가 직접 발송한 알림입니다_
